[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet"
version = "0.1.0"
description = "A declarative cluster scheduler built as reconciliation loops"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["fleet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "PIE",
    "RET",
    "SIM",
    "ARG",
    "PL",
    "RUF",
]
ignore = [
    "N818",
    "PLR0913",
    "PLR2004",
    "PLR0912",
    "PLR0915",
    "PLR0911",
    "SIM108",
    "RET504",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "ARG002"]
# Filters and scorers share one calling convention; unused halves are the contract.
"fleet/sched/filters.py" = ["ARG001"]
"fleet/sched/scorers.py" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"
